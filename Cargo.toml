[package]
name = "pond_ssg"
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sahil <404salad@gmail.com>"]
description = "A simple static site generator in Rust."
repository = "https://github.com/404salad/pond_ssg"
readme = "readme.md"
keywords = ["blog", "ssg", "rust", "site-generator"]
categories = ["command-line-utilities", "web-programming"]
exclude = [
    "content/**",
    "dist/**",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
bacon-ls = "0.29.0"
maud = "0.27.0"
pulldown-cmark = "0.9.3"
rayon = "1.10.0"
serde = { version="1.0.196", features = ["derive"] }
toml = "0.8.10"


[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
panic_in_result_fn = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
exit = "deny"
as_conversions = "deny"
